name: Build and deploy to Azure Container Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write # OIDC login to Azure
  contents: read
  packages: write # push image to GitHub Container Registry

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ vars.IMAGE_NAME }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # GitHub Container Registry is free for public packages, so no Azure Container Registry is needed.
      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # Builds the image with the .NET SDK's built-in container support (no Dockerfile needed).
      - name: Build and push image
        run: >
          dotnet publish StreamWriter.Web
          --configuration Release
          --os linux --arch x64
          -t:PublishContainer
          -p:ContainerRegistry=ghcr.io
          -p:ContainerRepository=${{ github.repository_owner }}/${{ vars.IMAGE_NAME }}
          -p:ContainerImageTags='"${{ github.sha }};latest"'

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # The package is public, so the container app pulls it without registry credentials.
      - name: Deploy
        run: >
          az containerapp update
          --resource-group ${{ vars.AZURE_RESOURCE_GROUP }}
          --name ${{ vars.AZURE_CONTAINER_APP }}
          --image $IMAGE:${{ github.sha }}
